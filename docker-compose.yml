services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grama-backend
    restart: unless-stopped
    environment:
      GRAMAVOICE_DB_URL: ${GRAMAVOICE_DB_URL:-jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
      GRAMAVOICE_DB_USERNAME: ${GRAMAVOICE_DB_USERNAME:-postgres.nffwpckgcrwaljmpxcef}
      GRAMAVOICE_DB_PASSWORD: ${GRAMAVOICE_DB_PASSWORD:-Prajubhai143}
      GRAMAVOICE_DB_DRIVER: org.postgresql.Driver
      GRAMAVOICE_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8085
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-30b}
      SARVAM_ENABLED: ${SARVAM_ENABLED:-true}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-replace-this-secret}
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grama-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5180:5180"
